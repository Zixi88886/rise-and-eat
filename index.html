<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rise &amp; Eat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>


<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span>
  <button class="toast-close" id="toastClose" type="button" aria-label="Dismiss message">&times;</button>
</div>

<div class="wrap">

  <div class="hero">
    <div class="hero-top">
      <div class="sun-stage" aria-hidden="true">
        <div class="sun"></div>
      </div>
      <h1 class="en en-f">Mornings are hard.<br>Breakfast can be easy.</h1>
      <button class="settings-btn" type="button" aria-label="Settings">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <div class="hero-zh" data-zh="hero" lang="zh-Hans"></div><div class="hero-zh" data-fr="hero" lang="fr"></div>

    <div class="time-picker">
      <div class="chips favorites-row" id="favoritesChips" role="group" aria-label="Favorites"></div>
      <div class="label tag-label"><span class="en en-f">What kind? (optional)</span> <span class="zh-inline" data-zh="kind" lang="zh-Hans"></span><span class="zh-inline" data-fr="kind" lang="fr"></span></div>
      <div class="chips" id="tagChips" role="group" aria-label="Filters"></div>
      <div class="kitchen-box">
        <button class="kitchen-card" id="kitchenCard" type="button">
          <span class="kitchen-card-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-2 11H5L3 9Z"/><path d="M8 9l3-5M16 9l-3-5"/></svg>
          </span>
          <span class="kitchen-card-text">
            <strong class="en en-f">My kitchen</strong><span class="zh-line" data-zh="myKitchen" lang="zh-Hans"></span><span class="zh-line" data-fr="myKitchen" lang="fr"></span>
            <span id="kitchenCount"></span>
          </span>
          <span class="kitchen-card-arrow" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
        <button class="kitchen-switch" id="kitchenSwitch" type="button" role="switch" aria-checked="false">
          <span class="kitchen-switch-text">
            <strong class="en en-f">Only what I have</strong><span class="zh-line" data-zh="onlyWhatIHave" lang="zh-Hans"></span><span class="zh-line" data-fr="onlyWhatIHave" lang="fr"></span>
            <span class="en en-f">Hide what I can’t make</span><span class="zh-line" data-zh="hideCantMake" lang="zh-Hans"></span><span class="zh-line" data-fr="hideCantMake" lang="fr"></span>
          </span>
          <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
        </button>
      </div>
      <div class="home-actions">
        <button class="surprise" id="surpriseBtn" type="button"><span class="en en-f">Decide for me</span> <span class="zh-inline" data-zh="decide" lang="zh-Hans"></span><span class="zh-inline" data-fr="decide" lang="fr"></span></button>
        <button class="surprise" id="addBtnHome" type="button"><span class="en en-f">+ Add a breakfast</span> <span class="zh-inline" data-zh="addBreakfast" lang="zh-Hans"></span><span class="zh-inline" data-fr="addBreakfast" lang="fr"></span></button>
      </div>
    </div>
  </div>

  <div class="top-bar" id="topBar" hidden>
    <div class="top-bar-inner" id="topBarInner">
      <button class="settings-btn in-bar" type="button" aria-label="Settings">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-inner" id="panelInner"></div>
  </div>

  <div class="prep">
    <button class="prep-toggle" id="prepToggle" aria-expanded="false" aria-controls="prepBody">
      <span class="prep-toggle-text">
        <span class="prep-toggle-top">
          <span class="prep-toggle-title"><span class="en en-f">Set up tonight</span> <span class="zh-inline" data-zh="setUpTonight" lang="zh-Hans"></span><span class="zh-inline" data-fr="setUpTonight" lang="fr"></span></span>
          <span class="prep-segments" id="prepSegments" role="progressbar" aria-label="Set up tonight progress" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"></span>
        </span>
        <span class="prep-toggle-sub" id="prepSub"></span>
      </span>
      <svg class="prep-arrow" id="prepArrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 6L8 11L13 6" stroke="#231A2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="prep-body" id="prepBody">
      <div class="say prep-intro"><div class="say-main"><span class="en en-f">Do these tonight.</span> <span class="zh-inline" data-zh="doTonight" lang="zh-Hans"></span><span class="zh-inline" data-fr="doTonight" lang="fr"></span></div><div class="say-small"><span class="en en-f">Save time tomorrow.</span> <span class="zh-inline" data-zh="saveTime" lang="zh-Hans"></span><span class="zh-inline" data-fr="saveTime" lang="fr"></span></div></div>
      <ul class="prep-list" id="prepList"></ul>
      <div class="say prep-order-hint" id="prepOrderHint" hidden></div>
      <div class="prep-actions">
        <button class="prep-choose" id="prepChooseBtn" type="button"><span class="btn-icon" aria-hidden="true">&#10133;</span><span class="btn-label en en-f">Choose tasks</span><span class="btn-zh" data-zh="chooseTasks" lang="zh-Hans"></span><span class="btn-zh" data-fr="chooseTasks" lang="fr"></span></button>
        <button class="prep-choose prep-reorder" id="prepReorderBtn" type="button" aria-pressed="false"><span class="btn-icon" aria-hidden="true">&#8597;&#65039;</span><span class="btn-label en en-f">Change order</span><span class="btn-zh" data-zh="changeOrder" lang="zh-Hans"></span><span class="btn-zh" data-fr="changeOrder" lang="fr"></span></button>
      </div>
    </div>
  </div>

</div>

<div class="home-bar">
  <div class="home-bar-inner">
    <button class="show-btn" id="showBtn" type="button"><span class="en en-f">Show breakfasts</span> <span class="zh-inline" data-zh="show" lang="zh-Hans"></span><span class="zh-inline" data-fr="show" lang="fr"></span></button>
  </div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
